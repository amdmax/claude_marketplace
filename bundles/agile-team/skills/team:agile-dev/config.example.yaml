# Agile Dev Team Configuration
# Copy this file to config.yaml and fill in your project values.

project:
  # Lowercase prefix used in branch names (e.g., "aigws" → feature/aigws-123-slug)
  prefix_lower: "myapp"

paths:
  # Base directory for all agent coordination artifacts
  # Override per-invocation with: /team:agile-dev --workspace <path> ...
  workspace_dir: ".agile-dev-team/docs"

  # Derived from workspace_dir at runtime:
  #   active-story.yaml → workspace_dir/active-story.yaml
  #   ADRs              → workspace_dir/adr/

  # NFR registry (input file — not written by agents)
  nfr_registry_file: ".claude/nfr-registry.json"
  # Story workflow config
  story_workflow_config: ".claude/story-workflow-config.json"
  # Test directory (where test code lives — separate from workspace)
  test_dir: "tests"

commands:
  # Full test suite command
  test: "npm test"
  # Unit test command
  test_unit: "npx jest --selectProjects unit --no-coverage"
  # Integration test command
  test_integration: "npx jest --selectProjects integration --no-coverage"
  # E2E test command
  test_e2e: "npx jest --selectProjects e2e --no-coverage"
  # Build command (for e2e tests that need a built site)
  build: "npm run build"

agents:
  # Agent definition directory (relative to project root)
  dir: ".claude/agents"
  # Agent files expected
  files:
    - "pm.md"
    - "architect.md"
    - "test-architect.md"
    - "backend-dev.md"
    - "frontend-dev.md"

# File boundaries for each agent role
# Update these to match your project structure.
# Paths under workspace_dir are written by convention — update workspace_dir
# in paths above to change all of them at once.
file_boundaries:
  pm:
    writable:
      - ".agile-dev-team/active-story.yaml"  # = workspace_dir/active-story.yaml
  architect:
    writable:
      - ".agile-dev-team/docs/adr/*.md"            # = workspace_dir/adr/*.md
      - ".agile-dev-team/active-story.yaml"   # = workspace_dir/active-story.yaml
  test_architect:
    writable:
      - "tests/**"
  backend_dev:
    writable:
      - "infrastructure/**"
      - "config.ts"
  frontend_dev:
    writable:
      - "src/**"
      - "*.html"
      - "styles.css"
      - "scripts/**"

# Skills invoked by this workflow
# Ensure these are installed in your project
required_skills:
  - "/fetch-story"
  - "/check-story-quality"
  - "/gather-context"
  - "/arch:create-adr"
  - "/commit"
  - "/pr"
