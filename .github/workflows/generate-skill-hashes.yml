name: Generate Skill Hashes

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'commands/**'
      - 'agents/**'
      - 'scripts/hash_published_artifacts.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-manifest:
    name: Hash published artifacts and sync registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate artifacts manifest
        run: python scripts/hash_published_artifacts.py

      - name: Commit manifest to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/published-artifacts-manifest.json
          if git diff --cached --exit-code; then
            echo "No changes to manifest — skipping commit"
          else
            git commit -m "chore: regenerate published-artifacts-manifest.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Dispatch sync to agentic_skills_registry
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $REGISTRY_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/amdmax/agentic_skills_registry/dispatches \
            -d "{\"event_type\":\"marketplace-updated\",\"client_payload\":{\"manifest_ref\":\"${{ github.sha }}\"}}"
          echo "Dispatched marketplace-updated event to agentic_skills_registry"

      - name: Upload manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-artifacts-manifest
          path: .claude-plugin/published-artifacts-manifest.json
          retention-days: 90

      - name: Publish manifest to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST=".claude-plugin/published-artifacts-manifest.json"

          # Find the latest release tag; create one if none exists
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)

          if [[ -z "$LATEST_TAG" ]]; then
            echo "No releases found — creating 'latest-manifest' release"
            gh release create latest-manifest \
              --title "Latest Artifacts Manifest" \
              --notes "Auto-generated release for published-artifacts-manifest.json asset. Do not delete."
            LATEST_TAG="latest-manifest"
          fi

          echo "Uploading manifest to release: $LATEST_TAG"
          gh release upload "$LATEST_TAG" "$MANIFEST" --clobber

          echo "## Artifacts Manifest Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release tag**: \`$LATEST_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Download URL**: https://github.com/${{ github.repository }}/releases/download/$LATEST_TAG/published-artifacts-manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifacts hashed**: $(python -c "import json; d=json.load(open('$MANIFEST')); print(len(d['artifacts']))")" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Generated at**: $(python -c "import json; d=json.load(open('$MANIFEST')); print(d['generated_at'])")" >> "$GITHUB_STEP_SUMMARY"
