# Until Green Configuration
# Copy this file to config.yaml and fill in your project values.

repository:
  # Slug used to build PR URLs (e.g., "myorg/myrepo")
  slug: "myorg/myrepo"
  # Base branch PRs target
  default_branch: "main"

paths:
  # Path to active story JSON (written by /fetch-story or /create-story)
  active_story_file: ".agile-dev-team/active-story.json"
  # Path where until-green stores its loop state
  until_green_state_file: ".agile-dev-team/until-green.json"

skills:
  # Skill invocation names — match what's installed in your project
  commit: "/commit"
  pull_request: "/pr"
  finalize_story: "/finalize-story"

ci:
  # Seconds to wait between polling gh pr checks
  poll_interval_seconds: 30
  # Maximum number of fix-and-retry iterations before giving up
  max_fix_iterations: 5
  # Minutes to wait for a check run to complete before timing out
  check_timeout_minutes: 15

behavior:
  # Automatically invoke the finalize-story skill when PR goes green
  auto_finalize_story: false
  # Push after each fix commit (set false only if you want to batch fixes)
  push_after_fix: true
